<div class="mock-launcher" data-launcher hidden>
	<button class="c-button c-button--primary c-button--medium" type="button">Open preview</button>
</div>
<script>
/* ==========================================================================
   Shared mock runtime: React-style batching, fuzzy filter, announcer, and the
   SelectPopoverOptionsList + SelectOptionsList port (multiSelectMode only).
   ========================================================================== */

const isMac = () => /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
const uuid = () => Math.random().toString(36).slice(2);
const buddyId = (id, type) => `${id}_${type}`;
const escapeHtml = (s) =>
	String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function setAttr(el, name, value) {
	if (value === null || value === undefined) el.removeAttribute(name);
	else if (el.getAttribute(name) !== String(value)) el.setAttribute(name, String(value));
}

// isPrintableKeyEvent
const isPrintableKeyEvent = (e) => !!e && !e.metaKey && !e.ctrlKey && e.key?.length === 1;

/* --------------------------------------------------------------------------
   Store: a tiny stand-in for React state. setState calls made while an event
   handler (or a commit) is running are queued and applied together once the
   outermost handler returns, so handlers read the last committed state just
   like props/state in React.
   -------------------------------------------------------------------------- */
function createStore(initialState, commit) {
	let state = initialState;
	let depth = 0;
	let flushing = false;
	const queue = [];

	const flush = () => {
		if (flushing) return;
		flushing = true;
		try {
			while (queue.length) {
				const batch = queue.splice(0);
				const prev = state;
				let next = state;
				batch.forEach(({ update }) => {
					const changes = typeof update === 'function' ? update(next) : update;
					if (changes) next = { ...next, ...changes };
				});
				state = next;
				depth += 1;
				try {
					commit(prev, state);
					batch.forEach(({ callback }) => callback && callback());
				} finally {
					depth -= 1;
				}
			}
		} finally {
			flushing = false;
		}
	};

	return {
		get: () => state,
		set(update, callback) {
			queue.push({ update, callback });
			if (depth === 0) flush();
		},
		// Wraps an event handler so the state updates it makes are batched.
		batched(fn) {
			return function batchedHandler(...args) {
				depth += 1;
				try {
					return fn.apply(this, args);
				} finally {
					depth -= 1;
					if (depth === 0) flush();
				}
			};
		},
		forceCommit() {
			queue.push({ update: null });
			if (depth === 0) flush();
		},
	};
}

/* --------------------------------------------------------------------------
   Announcer API stand-in (polite + assertive live regions)
   -------------------------------------------------------------------------- */
const announcer = (() => {
	let regions = null;
	const ensure = () => {
		if (regions) return regions;
		regions = {};
		['polite', 'assertive'].forEach((politeness) => {
			const el = document.createElement('div');
			el.className = 'offscreen';
			el.setAttribute('aria-live', politeness);
			el.setAttribute('aria-atomic', 'true');
			document.body.appendChild(el);
			regions[politeness] = el;
		});
		return regions;
	};
	return {
		send({ message, assertive = false, deferBy = 0 }) {
			if (!message) return;
			const run = () => {
				const el = ensure()[assertive ? 'assertive' : 'polite'];
				el.textContent = '';
				setTimeout(() => {
					el.textContent = message;
				}, 30);
			};
			if (deferBy) setTimeout(run, deferBy);
			else run();
		},
	};
})();

/* --------------------------------------------------------------------------
   FuzzyMatcher + defaultFilter (fuzzyLimit 3; no CJK, no beyond-word-boundary)
   -------------------------------------------------------------------------- */
const SEPARATOR_CHARS = /[- _'.\u2019\u200b()/\uFF0F]/gu;
const NEEDS_NORMALIZING = /[^\x20-\x7f]|[A-Z]|^ | $| {2}/;
const deburr = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function normalizeStringForMatching(str = '') {
	if (typeof str !== 'string') return '';
	if (str.length && !NEEDS_NORMALIZING.test(str)) return str;
	const trimmed = str.trim();
	if (!trimmed.length) return '';
	return deburr(trimmed.toLocaleLowerCase()).replace(/\s+/g, ' ');
}

class FuzzyMatcher {
	constructor(query, options = {}) {
		this.normalizedQuery = normalizeStringForMatching(query);
		this.queryNode = FuzzyMatcher.queryToLinkedList(this.normalizedQuery);
		this.fuzzyLimit = options.fuzzyLimit ?? Infinity;
		this.queryNoSeparators = this.normalizedQuery.replace(SEPARATOR_CHARS, '');
	}

	normalizeAndScore(sourceString) {
		const normalized = normalizeStringForMatching(sourceString);
		if (normalized === this.normalizedQuery) return 0;
		return this.score(normalized);
	}

	score(sourceString) {
		if (!sourceString) return Infinity;
		const sourceNoSeparators = sourceString.replace(SEPARATOR_CHARS, '');
		if (this.queryNoSeparators.length > sourceNoSeparators.length) return Infinity;
		if (!FuzzyMatcher.containsAllLetters(sourceString, this.queryNode) || !this.queryNode) {
			return Infinity;
		}
		const node = FuzzyMatcher.lettersToGraph(sourceString);
		if (!node) return Infinity;
		const result = FuzzyMatcher.searchWordBoundariesOnly(node, this.queryNode);
		if (!result) return Infinity;
		const summedUp = FuzzyMatcher.countResult(result);
		return summedUp > this.fuzzyLimit ? Infinity : summedUp;
	}

	static lettersToGraph(str) {
		const letters = str.split('');
		const first = letters.shift();
		return FuzzyMatcher.lettersToGraphWorker(first, null, letters, [], 0);
	}

	static lettersToGraphWorker(letter, prev, rest, jumps, index) {
		if (!letter) return null;
		const node = {
			letter,
			ignored: letter.match(SEPARATOR_CHARS),
			next: null,
			prev,
			jumps,
			visited: false,
			index,
		};
		const shouldAddJump = !node.ignored && (!prev || (prev.ignored && !node.ignored));
		if (shouldAddJump && jumps.length < 5) jumps.push(node);
		const nextNode = FuzzyMatcher.lettersToGraphWorker(rest.shift(), node, rest, jumps, index + 1);
		if (nextNode) node.next = nextNode;
		return node;
	}

	static queryToLinkedList(query) {
		if (!query) return null;
		let letters = query.split('');
		if (letters.length > 1024) letters = letters.slice(0, 1024);
		return FuzzyMatcher.queryToLinkedListWorker(letters, 0);
	}

	static queryToLinkedListWorker(letters, index) {
		if (index >= letters.length) return null;
		const letter = letters[index];
		return {
			letter,
			isSeparator: !!(letter.match(SEPARATOR_CHARS) && (index !== 0 || letters.length > 1)),
			next: FuzzyMatcher.queryToLinkedListWorker(letters, index + 1),
			index,
		};
	}

	static searchWordBoundariesOnly(node, queryNode) {
		let result = FuzzyMatcher.searchWorker(node, queryNode, 0);
		if (!result) {
			result = node.jumps.reduce((match, jumpNode) => {
				if (match || jumpNode === node) return match;
				return FuzzyMatcher.searchWorker(jumpNode, queryNode, 1);
			}, null);
		}
		return result;
	}

	static searchWorker(node, queryNode, score) {
		if (!node || !queryNode) return null;
		let thisMatch;
		if (!node.visited && (node.letter === queryNode.letter || (node.ignored && queryNode.isSeparator))) {
			thisMatch = { node, count: score };
		}
		if (!thisMatch) return null;
		if (!queryNode.next) return thisMatch;
		node.visited = true;
		let next = FuzzyMatcher.searchWorker(node.next, queryNode.next, 0);
		let nextQueryNode = queryNode.next;
		while (nextQueryNode.isSeparator && nextQueryNode.next) nextQueryNode = nextQueryNode.next;
		if (!next) {
			next = node.jumps.reduce((result, jumpNode) => {
				if (result) return result;
				if (jumpNode.visited || jumpNode === node) return result;
				return FuzzyMatcher.searchWorker(jumpNode, nextQueryNode, 1);
			}, null);
		}
		node.visited = false;
		if (next) {
			thisMatch.next = next;
			return thisMatch;
		}
		return null;
	}

	static countResult(result) {
		if (!result) return 0;
		return result.count + FuzzyMatcher.countResult(result.next);
	}

	static containsAllLetters(str, queryNode) {
		let ptr = queryNode;
		while (ptr) {
			if (!(ptr.isSeparator || str.includes(ptr.letter))) return false;
			ptr = ptr.next;
		}
		return true;
	}
}

function defaultFilter(options, filterQuery) {
	if (!filterQuery) return options;
	return options.filter((option) =>
		isFinite(new FuzzyMatcher(filterQuery, { fuzzyLimit: 3 }).normalizeAndScore(option.label)),
	);
}

/* --------------------------------------------------------------------------
   Options list (SelectPopoverOptionsList + SelectOptionsList, multiSelectMode)
   -------------------------------------------------------------------------- */
const DEFAULT_ROW_HEIGHT = 28;
const MAX_LIST_HEIGHT = 240;
const LIST_PADDING = 2;
const INPUT_WIDTH_OVERFLOW = 12;
const INPUT_HEIGHT_OVERLAP = 4;
const INPUT_OVERLAP_COMPENSATION = 32;
const POPOVER_FADE_DURATION = 80;
const POPOVER_ALLOWANCE_Y = 10;
const EMPTY_STATE_OPTION_VALUE = 'sk-select-empty-state';

const comboFor = (e) => {
	const key = { ArrowDown: 'down', ArrowUp: 'up', Enter: 'enter', Tab: 'tab' }[e.key];
	if (!key) return null;
	return [e.shiftKey && 'shift', e.altKey && 'alt', e.ctrlKey && 'ctrl', e.metaKey && 'meta', key]
		.filter(Boolean)
		.join('+');
};

/**
 * host: {
 *   selectId, getState(), setSelectState(changes, cb?),
 *   inputEl(), clickRegionEl(), sizingEl(), xAnchorEl?(), offsetY?(),
 *   persistFilterQueryOnClose, advanceFocusOnTab,
 *   onSelectionChange(option, isOptionClicked, viaTab), onOptionUnselected?,
 *   onOptionsListClose(clickedInput?)
 * }
 * state: { isExpanded, filterQuery, options, selectedOptions, activeRowIndex,
 *          pseudoActiveRowIndex, initialActiveOption }
 */
class OptionsList {
	constructor(host, batched) {
		this.host = host;
		this.batched = batched;
		this.mounted = false;
		this.isMouseMoveEnabled = false;
		this.rowEls = [];
		this.rowsKey = null;
		this.prevSnapshot = null;
		this.enableMouseMoveTimer = null;
		this.lastPseudoAnnouncementKey = null;
		this.onDocumentKeyDown = batched(this.onDocumentKeyDown.bind(this));
		this.onOverlayMouseDown = this.onOverlayMouseDown.bind(this);
		this.onOverlayClick = batched(this.onOverlayClick.bind(this));
		this.measure = this.measure.bind(this);
	}

	get state() {
		return this.host.getState();
	}

	getRows() {
		const { options } = this.state;
		if (options && options.length) return options;
		return [{ label: 'No items', value: EMPTY_STATE_OPTION_VALUE, isDisabled: true }];
	}

	isOptionSelected(option) {
		const { selectedOptions } = this.state;
		if (!selectedOptions || !selectedOptions.length || !option) return false;
		return selectedOptions.some((selected) => selected.value === option.value);
	}

	// Called by the host after every commit, like a render pass.
	update() {
		const state = this.state;
		if (!state.isExpanded) {
			if (this.mounted) this.unmount();
			return;
		}
		if (!this.mounted) {
			this.mount();
			return;
		}
		const prev = this.prevSnapshot;
		this.prevSnapshot = this.snapshot();
		this.render();
		this.componentDidUpdate(prev);
	}

	snapshot() {
		const { options, filterQuery } = this.state;
		return { optionsKey: (options || []).map((o) => `${o.value}\u0000${o.label}`).join('\u0001'), filterQuery };
	}

	/* ---------- lifecycle ---------- */

	mount() {
		this.mounted = true;
		this.prevSnapshot = this.snapshot();
		this.isInsideForm = !!this.host.inputEl()?.closest('form');
		this.buildDom();
		this.render();
		document.addEventListener('keydown', this.onDocumentKeyDown);
		window.addEventListener('resize', this.measure);
		window.addEventListener('scroll', this.measure);
		this.resizeObserver = new ResizeObserver(this.measure);
		[this.host.sizingEl(), this.host.xAnchorEl?.()].forEach((el) => el && this.resizeObserver.observe(el));

		// componentDidMount
		const { initialActiveOption } = this.state;
		// a11y_no_auto_highlight_search_multi_select is on: only an Alt/Arrow-key open highlights a row
		const activeRowIndex = initialActiveOption ? this.getActiveRowIndex() : undefined;
		const pseudoActiveRowIndex = this.getPseudoActiveRowIndex(activeRowIndex);
		this.host.setSelectState({ activeRowIndex, pseudoActiveRowIndex, initialActiveOption: undefined });
		if (typeof activeRowIndex === 'number' && activeRowIndex >= 0) this.scrollToRow(activeRowIndex);
	}

	componentDidUpdate(prev) {
		const next = this.prevSnapshot;
		const hasOptionsChanged = prev.optionsKey !== next.optionsKey;
		const hasSearchFilterChanged = prev.filterQuery !== next.filterQuery;
		if (!hasOptionsChanged && !hasSearchFilterChanged) return;
		const { initialActiveOption } = this.state;
		// Toggle on: the auto highlight is suppressed, whatever row would have been chosen
		const activeRowIndex = initialActiveOption !== undefined ? this.getActiveRowIndex() : undefined;
		const pseudoActiveRowIndex = this.getPseudoActiveRowIndex(activeRowIndex);
		this.host.setSelectState({ activeRowIndex, pseudoActiveRowIndex });
		if (typeof activeRowIndex === 'number' && activeRowIndex >= 0) this.scrollToRow(activeRowIndex);
	}

	unmount() {
		this.mounted = false;
		document.removeEventListener('keydown', this.onDocumentKeyDown);
		window.removeEventListener('resize', this.measure);
		window.removeEventListener('scroll', this.measure);
		this.resizeObserver?.disconnect();
		clearTimeout(this.enableMouseMoveTimer);
		this.isMouseMoveEnabled = false;
		this.lastPseudoAnnouncementKey = null;
		this.lastEmptyAnnouncementKey = null;
		const portal = this.portal;
		this.portal = null;
		this.rowEls = [];
		this.rowsKey = null;
		if (!portal) return;
		// ReactModal closeTimeoutMS: fade the content out, then remove the portal
		portal.overlay.classList.add('ReactModal__Overlay--before-close');
		portal.content.classList.add('ReactModal__Content--before-close');
		setTimeout(() => portal.root.remove(), POPOVER_FADE_DURATION);
	}

	/* ---------- DOM ---------- */

	buildDom() {
		const { selectId } = this.host;
		const root = document.createElement('div');
		root.className = 'ReactModalPortal';
		root.innerHTML = `
			<div class="ReactModal__Overlay ReactModal__Overlay--after-open c-popover c-popover--z_above_fs c-popover--fade" style="animation-duration: ${POPOVER_FADE_DURATION}ms;">
				<div class="ReactModal__Content ReactModal__Content--after-open popover c-popover__content" role="presentation" tabindex="-1" style="position: absolute; outline: none; transition-duration: ${POPOVER_FADE_DURATION}ms;">
					<div role="presentation">
						<div class="c-select_options_list__wrapper" data-qa="${escapeHtml(selectId)}-options-list-wrapper">
							<div class="c-select_options_list" data-qa="${escapeHtml(selectId)}-options-list" id="${escapeHtml(buddyId(selectId, 'listbox'))}" aria-label="Options" aria-multiselectable="true" role="listbox" tabindex="-1">
								<div class="ReactVirtualized__Grid ReactVirtualized__List c-select_options_list__virtual_list" role="presentation" no-bootstrap="1" style="box-sizing: content-box; direction: ltr; position: relative; will-change: transform; overflow-x: hidden; padding: 12px 0px;">
									<div class="ReactVirtualized__Grid__innerScrollContainer" role="presentation" style="width: auto; overflow: hidden; position: relative;"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>`;
		const overlay = root.querySelector('.c-popover');
		const content = root.querySelector('.c-popover__content');
		const listBody = root.querySelector('.c-select_options_list');
		const grid = root.querySelector('.ReactVirtualized__Grid');
		const inner = root.querySelector('.ReactVirtualized__Grid__innerScrollContainer');
		overlay.addEventListener('mousedown', this.onOverlayMouseDown);
		overlay.addEventListener('click', this.onOverlayClick);
		// Don't debounce -- enabling must happen before the next mouseenter
		listBody.addEventListener('mousemove', () => {
			this.isMouseMoveEnabled = true;
		});
		document.body.appendChild(root);
		this.portal = { root, overlay, content, listBody, grid, inner };
	}

	render() {
		if (!this.portal) return;
		const { selectId } = this.host;
		const { activeRowIndex, pseudoActiveRowIndex, filterQuery } = this.state;
		const rows = this.getRows();
		const rowsKey = rows.map((o) => `${o.value}\u0000${o.label}`).join('\u0001');
		const { inner } = this.portal;

		if (rowsKey !== this.rowsKey) {
			this.rowsKey = rowsKey;
			inner.textContent = '';
			this.rowEls = rows.map((option, index) => {
				const row = document.createElement('div');
				row.setAttribute('role', 'option');
				row.tabIndex = -1;
				row.id = buddyId(selectId, `option_${index}`);
				row.style.cssText = `height: ${DEFAULT_ROW_HEIGHT}px; left: 0px; position: absolute; top: ${index * DEFAULT_ROW_HEIGHT}px; width: 100%;`;
				row.addEventListener(
					'click',
					this.batched(() => this.onOptionClicked(this.getRows()[index])),
				);
				row.addEventListener(
					'mouseenter',
					this.batched(() => this.onMouseEnteredOption(index)),
				);
				row.addEventListener(
					'mouseleave',
					this.batched(() => this.onMouseLeftOption()),
				);
				inner.appendChild(row);
				return row;
			});
		}

		const setSize = rows.length;
		rows.forEach((option, index) => {
			const row = this.rowEls[index];
			const isActive = typeof activeRowIndex === 'number' && activeRowIndex === index;
			const isPseudoActive = !isActive && typeof pseudoActiveRowIndex === 'number' && pseudoActiveRowIndex === index;
			const isSelected = this.isOptionSelected(option);
			const isDisabled = !!option.isDisabled;
			const className = [
				'c-select_options_list__option',
				isActive && 'c-select_options_list__option--active',
				isPseudoActive && 'c-select_options_list__option--pseudo-active',
				isSelected && 'c-select_options_list__option--selected',
				isDisabled && 'c-select_options_list__option--disabled',
			]
				.filter(Boolean)
				.join(' ');
			if (row.className !== className) row.className = className;
			row.setAttribute('aria-selected', String(!!isSelected));
			row.setAttribute('aria-setsize', String(setSize));
			row.setAttribute('aria-posinset', String(index + 1));
			if (isDisabled) row.setAttribute('aria-disabled', 'true');
			else row.removeAttribute('aria-disabled');
			if (isActive) row.setAttribute('data-is-active', 'true');
			else row.removeAttribute('data-is-active');

			const html =
				(isSelected ? `<span class="c-select_options_list__selected" aria-hidden="true">${CHECK_SMALL_SVG}</span>` : '') +
				`<span data-qa="${escapeHtml(option.value)}" class="c-select_options_list__option_label">${escapeHtml(option.label)}</span>` +
				(isPseudoActive ? `<span class="c-select_options_list__option_shortcut">${KEYBOARD_KEY_ENTER_HTML}</span>` : '');
			if (row.__html !== html) {
				row.__html = html;
				row.innerHTML = html;
			}
		});

		// Announcements: the pseudo-active option (assertive, 200ms) and the empty state (750ms)
		if (typeof pseudoActiveRowIndex === 'number' && rows[pseudoActiveRowIndex]) {
			const option = rows[pseudoActiveRowIndex];
			const key = `${filterQuery ?? ''}-${String(option.value)}`;
			if (key !== this.lastPseudoAnnouncementKey) {
				this.lastPseudoAnnouncementKey = key;
				announcer.send({ message: option.label, assertive: true, deferBy: 200 });
			}
		} else {
			this.lastPseudoAnnouncementKey = null;
		}
		if (rows[0]?.value === EMPTY_STATE_OPTION_VALUE) {
			if (this.lastEmptyAnnouncementKey !== filterQuery) {
				this.lastEmptyAnnouncementKey = filterQuery;
				announcer.send({ message: 'No items', deferBy: 750 });
			}
		} else {
			this.lastEmptyAnnouncementKey = null;
		}

		this.measure();
	}

	// Popover + SelectPopoverOptionsList measuring/positioning
	measure() {
		if (!this.portal) return;
		const sizingEl = this.host.sizingEl();
		if (!sizingEl) return;
		const targetBounds = sizingEl.getBoundingClientRect();
		const xAnchorBounds = this.host.xAnchorEl?.()?.getBoundingClientRect() ?? targetBounds;
		const anchorLeft = Math.min(xAnchorBounds.left, targetBounds.left + targetBounds.width / 2);
		const rows = this.getRows();
		const totalRowHeight = rows.length * DEFAULT_ROW_HEIGHT;

		const spaceAbove = targetBounds.top;
		const spaceBelow = window.innerHeight - targetBounds.bottom;
		const isPopoverAbove = spaceBelow < Math.min(totalRowHeight, MAX_LIST_HEIGHT) && spaceBelow < spaceAbove;
		const spaceAboveOrBelow = isPopoverAbove ? targetBounds.top : window.innerHeight - targetBounds.bottom;
		const maxListHeight = Math.min(spaceAboveOrBelow - INPUT_OVERLAP_COMPENSATION, MAX_LIST_HEIGHT);
		const width = targetBounds.width + INPUT_WIDTH_OVERFLOW * 2;
		const height = totalRowHeight >= maxListHeight ? maxListHeight : totalRowHeight;
		const actualWidth = Math.max(1, width - LIST_PADDING);

		const { grid, inner, content } = this.portal;
		grid.style.height = `${height}px`;
		grid.style.width = `${actualWidth}px`;
		grid.style.overflowY = totalRowHeight > height ? 'auto' : 'hidden';
		inner.style.height = `${totalRowHeight}px`;
		inner.style.maxHeight = `${totalRowHeight}px`;
		inner.style.maxWidth = `${actualWidth}px`;
		this.listHeight = height;

		// Popover positioning: bottom-left / top-left of the adjusted target bounds
		const offsetY = this.host.offsetY?.() ?? 0;
		const { scrollY } = window;
		const adjusted = {
			top: targetBounds.top + scrollY + INPUT_HEIGHT_OVERLAP,
			bottom: targetBounds.bottom + scrollY - INPUT_HEIGHT_OVERLAP,
			left: anchorLeft - INPUT_WIDTH_OVERFLOW,
		};
		const contentRect = content.getBoundingClientRect();
		let top = isPopoverAbove ? adjusted.top - contentRect.height + offsetY : adjusted.bottom + offsetY;
		let left = adjusted.left;
		// keepInBounds (allowanceX = -INPUT_WIDTH_OVERFLOW, allowanceY = 10)
		const boundaries = {
			top: scrollY + POPOVER_ALLOWANCE_Y,
			right: window.innerWidth + INPUT_WIDTH_OVERFLOW,
			bottom: scrollY + window.innerHeight - POPOVER_ALLOWANCE_Y,
			left: -INPUT_WIDTH_OVERFLOW,
		};
		if (left < boundaries.left) left = boundaries.left;
		else if (left + contentRect.width > boundaries.right) {
			left = Math.max(boundaries.left, boundaries.right - contentRect.width);
		}
		if (top < boundaries.top) top = boundaries.top;
		else if (top + contentRect.height > boundaries.bottom) {
			top = Math.max(boundaries.top, boundaries.bottom - contentRect.height);
		}
		content.style.left = `${left}px`;
		content.style.top = `${top}px`;
	}

	scrollToRow(index) {
		const grid = this.portal?.grid;
		if (!grid) return;
		const rowTop = index * DEFAULT_ROW_HEIGHT;
		const rowBottom = rowTop + DEFAULT_ROW_HEIGHT;
		const height = this.listHeight ?? MAX_LIST_HEIGHT;
		if (rowTop < grid.scrollTop) grid.scrollTop = rowTop;
		else if (rowBottom > grid.scrollTop + height) grid.scrollTop = rowBottom - height;
	}

	/* ---------- active row helpers ---------- */

	getActiveRowIndex() {
		const { initialActiveOption } = this.state;
		if (!initialActiveOption) return undefined;
		const index = this.getRows().findIndex((option) => option.value === initialActiveOption.value);
		return index >= 0 ? index : undefined;
	}

	getPseudoActiveRowIndex(activeRowIndex) {
		if (this.isInsideForm) return undefined;
		if (typeof activeRowIndex === 'number') return undefined;
		const rows = this.getRows();
		if (!rows.length) return undefined;
		return rows[0].isDisabled ? undefined : 0;
	}

	getNextActiveRowIndex(current) {
		const rows = this.getRows();
		if (!rows.length) return -1;
		if (current === rows.length - 1) return -1;
		const start = typeof current === 'number' ? current + 1 : 0;
		return start < rows.length ? start : -1;
	}

	getPreviousActiveRowIndex(current) {
		if (current === 0) return -1;
		const rows = this.getRows();
		if (!rows.length) return -1;
		const start = typeof current === 'number' ? current - 1 : rows.length - 1;
		return start >= 0 ? start : -1;
	}

	clearActive() {
		this.host.setSelectState({
			activeRowIndex: undefined,
			pseudoActiveRowIndex: this.getPseudoActiveRowIndex(undefined),
		});
	}

	moveTo(index) {
		this.host.setSelectState({ activeRowIndex: index, pseudoActiveRowIndex: undefined });
		// Mouse move is disabled while navigating by keyboard, re-enabled 200ms after the last key
		clearTimeout(this.enableMouseMoveTimer);
		this.enableMouseMoveTimer = setTimeout(() => {
			this.isMouseMoveEnabled = true;
		}, 200);
		this.scrollToRow(index);
	}

	/* ---------- key commands (Mousetrap on document) ---------- */

	shouldInterceptKeyEvent(e) {
		const target = e.target;
		if (!(target instanceof Element)) return false;
		if (target.hasAttribute('aria-autocomplete')) return true;
		if (target.hasAttribute('aria-haspopup')) return true;
		return !!this.portal?.listBody.contains(target);
	}

	onDocumentKeyDown(e) {
		if (!this.mounted || e.keyCode === 229) return;
		switch (comboFor(e)) {
			case 'down':
				return this.onArrowDown(e);
			case 'up':
				return this.onArrowUp(e);
			case 'enter':
				return this.onEnter(e);
			case 'alt+up':
			case 'alt+down':
				return this.onAltArrowUpOrDown(e);
			case 'tab':
				return this.onTab(e);
			case 'shift+tab':
				return this.onShiftTab(e);
			default:
		}
	}

	onArrowDown(e) {
		this.isMouseMoveEnabled = false;
		if (!this.shouldInterceptKeyEvent(e)) return;
		const { isExpanded, activeRowIndex } = this.state;
		if (isExpanded) e.preventDefault();
		const next = this.getNextActiveRowIndex(activeRowIndex);
		if (next === -1) {
			this.clearActive(); // shouldWrap
			return;
		}
		this.moveTo(next);
	}

	onArrowUp(e) {
		this.isMouseMoveEnabled = false;
		if (!this.shouldInterceptKeyEvent(e)) return;
		const { isExpanded, activeRowIndex } = this.state;
		if (isExpanded) e.preventDefault();
		const prev = this.getPreviousActiveRowIndex(activeRowIndex);
		if (prev === -1) {
			this.clearActive(); // shouldWrap
			return;
		}
		this.moveTo(prev);
	}

	getEffectiveActiveOption() {
		const { activeRowIndex, pseudoActiveRowIndex } = this.state;
		const index = activeRowIndex ?? pseudoActiveRowIndex;
		return typeof index === 'number' ? this.getRows()[index] : undefined;
	}

	onEnter(e) {
		if (!this.shouldInterceptKeyEvent(e)) return;
		e.preventDefault();
		const activeOption = this.getEffectiveActiveOption() || this.state.initialActiveOption;
		if (activeOption && activeOption.isDisabled) return;
		this.handleSelectionChange(activeOption);
	}

	onAltArrowUpOrDown(e) {
		if (!this.shouldInterceptKeyEvent(e)) return;
		if (!this.state.isExpanded) return;
		e.stopPropagation();
		e.preventDefault();
		this.closeOptionsList(); // multiSelectMode only closes
	}

	onTab(e) {
		if (!this.shouldInterceptKeyEvent(e)) return;
		if (!this.state.isExpanded) return;
		const activeOption = this.getEffectiveActiveOption();
		if (this.host.advanceFocusOnTab) {
			if (activeOption && !activeOption.isDisabled) {

/* FocusEventManager: whether the user is driving the page with the keyboard. Buttons and the
   checkbox show their focus rings only in keyboard mode; v1 also uses it to select all tokens. */
const KEYBOARD_NAVIGATION_KEYS = ['Tab', 'F6', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
const keyboardMode = (() => {
	const mode = { value: false, relatedEvent: null, listeners: new Set() };
	const isInputElement = (el) =>
		el.nodeName === 'INPUT' || el.nodeName === 'SELECT' || el.nodeName === 'TEXTAREA' || el.isContentEditable;
	const syncFocusVisibleClasses = () => {
		document.querySelectorAll('.c-button, .c-icon_button').forEach((el) => {
			el.classList.toggle('c-button--focus-visible', mode.value);
		});
		document.querySelectorAll('.c-input_checkbox').forEach((el) => {
			el.classList.toggle('c-input_checkbox--focus-visible', mode.value);
		});
	};
	const setValue = (value) => {
		if (value === mode.value) return;
		mode.value = value;
		syncFocusVisibleClasses();
		mode.listeners.forEach((listener) => listener(value));
	};
	mode.sync = syncFocusVisibleClasses;
	document.addEventListener('keydown', ({ type, key, shiftKey }) => {
		mode.relatedEvent = { type, key, shiftKey };
	}, true);
	document.addEventListener('mousedown', ({ type, ctrlKey }) => {
		if (isMac() && mode.value && ctrlKey) return;
		mode.relatedEvent = { type };

		const { relatedEvent } = mode;
		const isKbNavEvent = relatedEvent?.type === 'keydown' && KEYBOARD_NAVIGATION_KEYS.includes(relatedEvent.key);

		if (target instanceof Element && isInputElement(target)) return;
		const next = isKbNavEvent || (mode.value && !relatedEvent);
		mode.relatedEvent = null;
		setValue(next);
	}, true);

		mode.relatedEvent = null;
	});

})();

const LANGUAGES_LABEL = 'Translation languages (Version 1)';
const LANGUAGES_DESCRIPTION = 'We’ll offer message translations in these languages';
const SEARCH_PLACEHOLDER = 'Search to add languages';
const MODAL_TITLE = 'Translation languages (Version 1)';
const SHOW_TRANSLATE_BUTTON_LABEL = 'Show Translate button on messages';
const CANCEL_LABEL = 'Cancel';
const SUBMIT_LABEL = 'Submit';
const MAX_LANGUAGES = 5;
const MAX_LANGUAGES_ERROR = 'Maximum exceeded: please choose at most 5 languages.';

const toOption = ({ name, locale }) => ({ label: name, value: locale });
const LANGUAGE_OPTIONS = MOCK_LOCALES.filter((l) => !l.exclude).map(toOption);
const getSelectedLanguageOptions = (codes) => MOCK_LOCALES.filter((l) => codes.includes(l.locale)).map(toOption);

const FOCUSABLE_SELECTOR =
	'a[href], area[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), iframe, object, embed, [tabindex], [contenteditable]';

const isTabbable = (el) => {
	if (el.closest('[hidden]') || el.getAttribute('tabindex') === '-1') return false;
	if (el.isContentEditable === false && el.getAttribute('contenteditable') === 'false' && !el.hasAttribute('tabindex')) {
		return false;
	}
	const rect = el.getBoundingClientRect();
	return rect.width > 0 || rect.height > 0;
};

/**
 * Opens the preview modal. `createSelect(mountEl, props)` builds the version-specific multi-select
 * and returns { setProps, destroy, focus? }. `focusOnOpen(select)` lands initial focus.
 */
function openPreviewModal({ createSelect, focusOnOpen, onClosed }) {
	const titleId = `modal_title_${uuid()}`;
	const checkboxId = `show_translate_${uuid()}`;
	const descriptionId = `languages_description_${uuid()}`;
	const errorId = `${titleId}_error`;

	let selectedLanguages = getSelectedLanguageOptions(PRESELECTED_LANGUAGE_CODES);
	let showTranslateButton = true;
	let showMaxError = false;

	const portal = document.createElement('div');
	portal.className = 'ReactModalPortal c-sk-modal_portal';
	portal.innerHTML = renderModalHtml({ titleId, checkboxId, descriptionId });
	document.body.appendChild(portal);

	const overlay = portal.querySelector('.c-sk-overlay');
	const content = portal.querySelector('.c-sk-modal');
	const checkbox = portal.querySelector(`#${checkboxId}`);
	const selectMount = portal.querySelector('[data-select-mount]');
	const cancelButton = portal.querySelector('[data-qa="cancel_button"]');
	const submitButton = portal.querySelector('[data-qa="submit_button"]');
	const closeButton = portal.querySelector('[data-qa="sk_close_modal_button"]');

	const getErrors = () => (showMaxError ? [{ id: errorId, message: MAX_LANGUAGES_ERROR }] : undefined);
	const syncSelect = () => {
		select.setProps({ isDisabled: !showTranslateButton, errors: getErrors() });
		announceErrors(getErrors());
	};

	const select = createSelect(selectMount, {
		selectId: 'languages_multi_select',
		ariaLabel: LANGUAGES_LABEL,
		ariaDescribedBy: descriptionId,
		placeholder: SEARCH_PLACEHOLDER,
		placeholderText: SEARCH_PLACEHOLDER,
		options: LANGUAGE_OPTIONS,
		initialSelectedOptions: getSelectedLanguageOptions(PRESELECTED_LANGUAGE_CODES),
		isDisabled: false,
		errors: undefined,
		onSelectedItemsChange: (languages) => {
			selectedLanguages = languages;
			// Clear the error as soon as the selection is back within the limit
			if (languages.length <= MAX_LANGUAGES && showMaxError) {
				showMaxError = false;
				syncSelect();
			}
		},
	});

	const close = () => {
		document.removeEventListener('keydown', onDocumentKeyDownCapture, true);
		scrollResizeObserver.disconnect();
		select.destroy();
		portal.remove();
		onClosed?.();
	};

	checkbox.addEventListener('change', () => {
		showTranslateButton = checkbox.checked;
		// Hiding the Translate button disables the select, so drop any error
		if (!showTranslateButton) showMaxError = false;
		syncSelect();
	});

	submitButton.addEventListener('click', () => {
		if (showTranslateButton && selectedLanguages.length > MAX_LANGUAGES) {
			showMaxError = true;
			syncSelect();
			return;
		}
		close();
	});
	cancelButton.addEventListener('click', close);
	closeButton.addEventListener('click', close);

	// ReactModal: Escape on the dialog requests close unless something already handled it
	content.addEventListener('keydown', (e) => {
		if (e.key === 'Escape' || e.keyCode === 27) {
			if (e.defaultPrevented) return;
			e.preventDefault();
			e.stopPropagation();
			close();
			return;
		}
		if (e.key === 'Tab') scopeTab(e);
	});

	// ReactModal's scopeTab: keep Tab focus within the dialog
	function scopeTab(e) {
		const tabbable = Array.from(content.querySelectorAll(FOCUSABLE_SELECTOR)).filter(isTabbable);
		if (!tabbable.length) {
			e.preventDefault();
			return;
		}
		const first = tabbable[0];
		const last = tabbable[tabbable.length - 1];
		const active = document.activeElement;
		if (e.shiftKey && (active === first || active === content)) {
			e.preventDefault();
			last.focus();
		} else if (!e.shiftKey && active === last) {
			e.preventDefault();
			first.focus();
		}
	}

	// Focus that escapes to the body (e.g. after a click-away) returns into the dialog on Tab
	function onDocumentKeyDownCapture(e) {
		if (e.key !== 'Tab' || content.contains(document.activeElement)) return;
		if (document.querySelector('.c-popover')) return;
		e.preventDefault();
		const tabbable = Array.from(content.querySelectorAll(FOCUSABLE_SELECTOR)).filter(isTabbable);
		(e.shiftKey ? tabbable[tabbable.length - 1] : tabbable[0])?.focus();
	}
	document.addEventListener('keydown', onDocumentKeyDownCapture, true);

	// Overlay click closes the modal (only for a press that started and ended on the overlay)
	let overlayPressed = false;
	overlay.addEventListener('mousedown', (e) => {
		overlayPressed = e.target === overlay;
	});
	overlay.addEventListener('click', (e) => {
		if (overlayPressed && e.target === overlay) close();
		overlayPressed = false;
	});

	// Scrollbar sizes its child to the content's measured width (the hider overhangs by 50px)
	const scrollContent = portal.querySelector('.c-sk-modal_content');
	const scrollChild = portal.querySelector('.c-scrollbar__child');
	const sizeScrollChild = () => {
		scrollChild.style.width = `${scrollContent.clientWidth}px`;
	};
	sizeScrollChild();
	const scrollResizeObserver = new ResizeObserver(sizeScrollChild);
	scrollResizeObserver.observe(scrollContent);

	keyboardMode.sync();

	// shouldFocusAfterRender: focus the dialog unless focus already landed inside it, then onAfterOpen
	if (!content.contains(document.activeElement)) content.focus();
	focusOnOpen?.(select, content);

	return { close };
}

function mountPreview({ createSelect, focusOnOpen }) {
	const launcher = document.querySelector('[data-launcher]');
	const open = () => {
		launcher.hidden = true;
		openPreviewModal({
			createSelect,
			focusOnOpen,
			onClosed: () => {
				launcher.hidden = false;
				launcher.querySelector('button').focus();
			},
		});
	};
	launcher.querySelector('button').addEventListener('click', open);
	open();
}


mountPreview({
	createSelect: createMultiSelectV1,
	// v1: MultiSelect focusOnMount focuses the input as it mounts
		focusOnOpen: (select) => select.focus(),
});
</script>
</body>
